name: Check upstream
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - id: check
        name: Check for new upstream version
        run: python scripts/check_upstream.py
        continue-on-error: true

      - name: Open issue if new version found
        if: steps.check.outputs.is_new == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const up = "${{ steps.check.outputs.upstream }}";
            const pub = "${{ steps.check.outputs.published }}";
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `New DGHDRtoSDR version available: ${up}`,
              body:  `Upstream: **${up}**\nPyPI: ${pub}\n\n` +
                     `Please verify the archive structure is unchanged, ` +
                     `then trigger the **Release to PyPI** workflow manually ` +
                     `with version \`${up}\`.`
            });
